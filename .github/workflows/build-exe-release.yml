name: Build Backend EXE and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump (major=+1.0.0 large/refactor, minor=+0.1.0 feature, patch=+0.0.1 bugfix)'
        required: true
        default: minor
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

concurrency:
  group: lyricsphere-exe-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify sync-manifest (before version inject)
        shell: pwsh
        run: |
          if (-not (Test-Path '.\sync-manifest.json')) {
            Write-Error 'sync-manifest.json missing; sync from private famyliam first'
            exit 1
          }
          if (-not (Test-Path '.\scripts\verify_sync_manifest.py')) {
            Write-Error 'scripts/verify_sync_manifest.py missing'
            exit 1
          }
          python .\scripts\verify_sync_manifest.py check-worktree --root . --manifest .\sync-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-backend.txt
          pip install pyinstaller

      - name: Import smoke (subsonic + app modules)
        shell: pwsh
        run: |
          python -c "import subsonic; import subsonic.handler; print('subsonic_ok')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path '.\templates\lyric-sphere-v2\dist\index.html')) {
            Write-Error 'templates/lyric-sphere-v2/dist/index.html missing'
            exit 1
          }

      - name: Resolve release tag and message
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force

          $latestMsg = git log -1 --pretty=%B | Out-String
          $latestMsg = $latestMsg.TrimEnd()
          if (-not $latestMsg) {
            $latestMsg = "No commit message"
          }
          $releaseBody = "HKLHaoBin`n$latestMsg"

          # Semver bump rules:
          #   major (+1.0.0): large changes / refactors / breaking
          #   minor (+0.1.0): feature updates
          #   patch (+0.0.1): bug fixes
          function Resolve-BumpKind([string]$Message, [string]$DispatchBump) {
            if ($DispatchBump -and $DispatchBump -in @('major', 'minor', 'patch')) {
              return $DispatchBump
            }
            $head = ($Message -split "`n")[0]
            if ($Message -match '(?im)^breaking change\b' -or $head -match '^(feat|fix|refactor|perf|chore)(\([^)]*\))?!:' -or $head -match '(?i)\b(major|breaking)\b') {
              return 'major'
            }
            if ($head -match '^(fix|hotfix)(\(|:)' -or $head -match '(?i)\b(bug\s*fix|hotfix)\b') {
              return 'patch'
            }
            if ($head -match '^(feat|feature)(\(|:)' -or $head -match '(?i)\b(feature|日常功能)\b') {
              return 'minor'
            }
            if ($head -match '^(refactor)(\(|:)' -or $head -match '(?i)\b(refactor|重构|大量修改)\b') {
              return 'major'
            }
            # Default: feature-style bump so push-to-main still advances auto-update.
            return 'minor'
          }

          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            Write-Host "Tag trigger detected, use existing tag: $tag"
          } else {
            $dispatchBump = "${{ github.event.inputs.bump }}"
            $bump = Resolve-BumpKind -Message $latestMsg -DispatchBump $dispatchBump
            Write-Host "Semver bump kind: $bump"

            $tags = git tag --list "v*.*.*"
            $versionTags = @()
            foreach ($t in $tags) {
              if ($t -match '^v(\d+)\.(\d+)\.(\d+)$') {
                $versionTags += [PSCustomObject]@{
                  Tag = $t
                  Major = [int]$matches[1]
                  Minor = [int]$matches[2]
                  Patch = [int]$matches[3]
                }
              }
            }

            if ($versionTags.Count -eq 0) {
              $tag = "v1.0.0"
            } else {
              $latest = $versionTags |
                Sort-Object -Property @{Expression = 'Major'; Descending = $true}, @{Expression = 'Minor'; Descending = $true}, @{Expression = 'Patch'; Descending = $true} |
                Select-Object -First 1
              switch ($bump) {
                'major' { $tag = "v$($latest.Major + 1).0.0" }
                'patch' { $tag = "v$($latest.Major).$($latest.Minor).$($latest.Patch + 1)" }
                default { $tag = "v$($latest.Major).$($latest.Minor + 1).0" }
              }
            }

            Write-Host "Create and push new tag: $tag"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tag
            git push origin $tag
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $delimiter = [guid]::NewGuid().ToString()
          "release_body<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $releaseBody | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Inject version into backend.py and updater.py
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.tag }}".TrimStart('v')
          $placeholder = 'APP_VERSION = "0.0.0-dev"'
          $newLine = "APP_VERSION = ""$version"""
          foreach ($target in @('.\backend.py', '.\updater.py')) {
            $content = Get-Content $target -Raw
            if (-not $content.Contains($placeholder)) {
              Write-Error "Placeholder for version not found in $target"
              exit 1
            }
            $content = $content.Replace($placeholder, $newLine)
            Set-Content -Path $target -Value $content -Encoding UTF8
          }

      - name: Verify injected version in backend.py and updater.py
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.tag }}".TrimStart('v')
          foreach ($target in @('.\backend.py', '.\updater.py')) {
            $matches = Select-String -Path $target -Pattern '^APP_VERSION = "([^"]+)"' -AllMatches
            if ($matches.Count -ne 1) {
              Write-Error "Expected exactly one APP_VERSION assignment in $target, found $($matches.Count)"
              exit 1
            }
            $value = $matches[0].Matches[0].Groups[1].Value
            if ($value -ne $version) {
              Write-Error "Injected version mismatch in $target. Expected $version, found $value"
              exit 1
            }
          }

      - name: Build backend.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm backend.spec

      - name: Build updater.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --console ".\updater.py"

      - name: Assemble clean release directory
        shell: pwsh
        run: |
          if (Test-Path release) { Remove-Item release -Recurse -Force }
          New-Item -ItemType Directory -Path release/LyricSphere.exe -Force | Out-Null

          Copy-Item dist/backend.exe release/LyricSphere.exe/backend.exe -Force
          Copy-Item dist/updater.exe release/LyricSphere.exe/updater.exe -Force
          Copy-Item templates release/LyricSphere.exe/templates -Recurse -Force

          $staticDest = "release/LyricSphere.exe/static"
          New-Item -ItemType Directory -Path $staticDest -Force | Out-Null
          foreach ($dir in @('assets','public','icons','monaco')) {
            if (Test-Path "static/$dir") {
              Copy-Item "static/$dir" "$staticDest/$dir" -Recurse -Force
            }
          }

          if (-not (Test-Path 'release/LyricSphere.exe/static/assets')) {
            Write-Error 'release missing static/assets'
            exit 1
          }
          Copy-Item sync-manifest.json release/LyricSphere.exe/sync-manifest.json -Force
          New-Item -ItemType Directory -Path release/LyricSphere.exe/scripts -Force | Out-Null
          Copy-Item scripts/verify_sync_manifest.py release/LyricSphere.exe/scripts/verify_sync_manifest.py -Force

      - name: Self-test Subsonic on TEMP copy
        shell: pwsh
        run: |
          $id = [guid]::NewGuid().ToString('N').Substring(0, 8)
          $smokeRoot = Join-Path $env:RUNNER_TEMP "lyricsphere-self-test-$id"
          $stdoutLog = Join-Path $env:RUNNER_TEMP "lyricsphere-self-test-$id-stdout.txt"
          $stderrLog = Join-Path $env:RUNNER_TEMP "lyricsphere-self-test-$id-stderr.txt"
          $proc = $null
          try {
            Copy-Item -Path 'release/LyricSphere.exe' -Destination $smokeRoot -Recurse -Force
            $env:FAMYLIAM_SKIP_INDEX_INIT = '1'
            $exe = Join-Path $smokeRoot 'backend.exe'
            $proc = Start-Process -FilePath $exe `
              -ArgumentList '--self-test-subsonic' `
              -WorkingDirectory $smokeRoot `
              -PassThru `
              -NoNewWindow `
              -RedirectStandardOutput $stdoutLog `
              -RedirectStandardError $stderrLog
            if (-not $proc.WaitForExit(60000)) {
              try { $proc.Kill() } catch {}
              throw 'self-test timed out after 60s'
            }
            if (Test-Path -LiteralPath $stdoutLog) {
              Get-Content -LiteralPath $stdoutLog | Write-Host
            }
            if (Test-Path -LiteralPath $stderrLog) {
              Get-Content -LiteralPath $stderrLog | Write-Host
            }
            $exitCode = $proc.ExitCode
            if ($exitCode -ne 0) {
              throw "self-test failed with exit code $exitCode"
            }
            Write-Host 'SELF_TEST_SUBSONIC_OK (CI)'
          }
          finally {
            if ($null -ne $proc -and -not $proc.HasExited) {
              try { $proc.Kill() } catch {}
            }
            if (Test-Path -LiteralPath $smokeRoot) {
              Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $stdoutLog, $stderrLog -Force -ErrorAction SilentlyContinue
          }

      - name: Zip clean release and audit
        shell: pwsh
        run: |
          if (Test-Path LyricSphere.exe.zip) {
            Remove-Item LyricSphere.exe.zip -Force
          }
          Compress-Archive -Path release/LyricSphere.exe/* -DestinationPath LyricSphere.exe.zip -Force

          $hash = Get-FileHash -Algorithm SHA256 -Path LyricSphere.exe.zip
          $hash.Hash | Out-File -FilePath LyricSphere.exe.zip.sha256 -Encoding ascii

          $auditDir = Join-Path $env:RUNNER_TEMP ("lyricsphere-zip-audit-" + [guid]::NewGuid().ToString('N').Substring(0, 8))
          try {
            python .\scripts\verify_sync_manifest.py check-zip `
              --zip .\LyricSphere.exe.zip `
              --manifest .\sync-manifest.json `
              --extract-dir $auditDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            if (Test-Path -LiteralPath $auditDir) {
              Remove-Item -LiteralPath $auditDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-and-updater.exe
          path: |
            dist/backend.exe
            dist/updater.exe
            LyricSphere.exe.zip
            LyricSphere.exe.zip.sha256
          if-no-files-found: error

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LyricSphere.exe
          body: ${{ steps.version.outputs.release_body }}
          files: |
            LyricSphere.exe.zip
            LyricSphere.exe.zip.sha256
          fail_on_unmatched_files: true
